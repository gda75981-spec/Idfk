<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MXW01 Printer</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#fff; }
  .wrap { max-width:560px; margin:auto; padding:22px; }
  h1 { margin:0 0 6px; font-size:26px; }
  .sub { color:#aaa; margin-bottom:18px; }
  button,input { font:inherit; }
  button { width:100%; padding:14px; margin:7px 0; border:0; border-radius:12px; background:#2f7df6; color:#fff; font-weight:700; }
  button.secondary { background:#292929; }
  button:disabled { opacity:.45; }
  .card { background:#1b1b1b; border-radius:16px; padding:16px; margin:12px 0; }
  #preview { display:block; max-width:100%; max-height:380px; margin:10px auto; background:#fff; image-rendering:auto; }
  #status { white-space:pre-wrap; color:#b9ffb9; min-height:24px; }
  label { display:block; margin:10px 0 5px; color:#ccc; }
  input[type=file] { width:100%; }
  input[type=range] { width:100%; }
  .small { color:#888; font-size:13px; line-height:1.4; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐱 MXW01 Printer</h1>
  <div class="sub">Tiny browser printer for your MXW01 — no printer account required.</div>

  <div class="card">
    <button id="connect">Connect MXW01</button>
    <button id="disconnect" class="secondary" disabled>Disconnect</button>
    <div id="status">Not connected.</div>
  </div>

  <div class="card">
    <label>Choose a picture</label>
    <input id="file" type="file" accept="image/*">
    <canvas id="preview"></canvas>
    <label>Darkness: <span id="darkVal">93</span></label>
    <input id="dark" type="range" min="30" max="255" value="93">
    <button id="print" disabled>🖨️ Print picture</button>
  </div>

  <div class="card small">
    The MXW01 prints at 384 pixels wide. Pictures are converted to black/white
    thermal-printer data before being sent over Bluetooth LE.
  </div>
</div>

<script>
const SERVICE = "0000ae30-0000-1000-8000-00805f9b34fb";
const CONTROL = "0000ae01-0000-1000-8000-00805f9b34fb";
const NOTIFY  = "0000ae02-0000-1000-8000-00805f9b34fb";
const DATA    = "0000ae03-0000-1000-8000-00805f9b34fb";

const WIDTH = 384;
const ROW_BYTES = 48;
const MIN_BYTES = 4320;
const encoder = new TextEncoder();

let device = null, server = null, control = null, notify = null, dataChar = null;
let selectedImage = null;
let notificationWaiters = [];

const $ = id => document.getElementById(id);
function log(s) { $("status").textContent = s; }

function crc8(bytes) {
  // MXW01's documented CRC: polynomial 0x07, init 0.
  let crc = 0;
  for (const b of bytes) {
    crc = CRC_TABLE[crc ^ b];
  }
  return crc;
}
const CRC_TABLE = (() => {
  const t = new Uint8Array(256);
  for (let i=0;i<256;i++) {
    let c=i;
    for (let j=0;j<8;j++) c = (c & 0x80) ? ((c << 1) ^ 0x07) & 255 : (c << 1) & 255;
    t[i]=c;
  }
  return t;
})();

function command(id, payload) {
  const out = new Uint8Array(8 + payload.length);
  out[0]=0x22; out[1]=0x21; out[2]=id; out[3]=0;
  out[4]=payload.length & 255; out[5]=(payload.length >> 8) & 255;
  out.set(payload,6);
  out[6+payload.length]=crc8(payload);
  out[7+payload.length]=0xFF;
  return out;
}

function parsePacket(a) {
  if (a.length < 6 || a[0]!==0x22 || a[1]!==0x21) return null;
  const id=a[2], len=a[4] | (a[5]<<8);
  if (a.length < 6+len) return null;
  return {id, payload:a.slice(6,6+len)};
}

function waitFor(id, timeout=7000) {
  return new Promise((resolve,reject)=>{
    const item={id,resolve};
    notificationWaiters.push(item);
    setTimeout(()=>{
      const i=notificationWaiters.indexOf(item);
      if(i>=0){ notificationWaiters.splice(i,1); reject(new Error("Timed out waiting for 0x"+id.toString(16).toUpperCase())); }
    },timeout);
  });
}

function notifyHandler(ev) {
  const p=parsePacket(new Uint8Array(ev.target.value.buffer));
  if(!p) return;
  for(let i=notificationWaiters.length-1;i>=0;i--){
    if(notificationWaiters[i].id===p.id){
      const w=notificationWaiters.splice(i,1)[0];
      w.resolve(p.payload);
    }
  }
}

async function connect() {
  if (!navigator.bluetooth) {
    throw new Error("This browser does not support Web Bluetooth. Use Chrome on Android over HTTPS.");
  }
  log("Choose MXW01…");
  device = await navigator.bluetooth.requestDevice({
    filters: [{namePrefix:"MXW01"}],
    optionalServices: [SERVICE]
  });
  log("Connecting to " + (device.name || "MXW01") + "…");
  server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  control = await svc.getCharacteristic(CONTROL);
  notify = await svc.getCharacteristic(NOTIFY);
  dataChar = await svc.getCharacteristic(DATA);
  notify.addEventListener("characteristicvaluechanged", notifyHandler);
  await notify.startNotifications();
  $("connect").disabled=true; $("disconnect").disabled=false; $("print").disabled=!selectedImage;
  log("Connected to " + (device.name || "MXW01") + ".");
}

async function disconnect() {
  try { if(notify) await notify.stopNotifications(); } catch(e){}
  try { if(device && device.gatt.connected) device.gatt.disconnect(); } catch(e){}
  device=server=control=notify=dataChar=null;
  $("connect").disabled=false; $("disconnect").disabled=true; $("print").disabled=true;
  log("Disconnected.");
}

function imageToBuffer(img, threshold=180) {
  // Fit the image to 384px wide while preserving aspect ratio.
  const scale = WIDTH / img.naturalWidth;
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement("canvas");
  c.width=WIDTH; c.height=h;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,WIDTH,h);
  ctx.drawImage(img,0,0,WIDTH,h);

  const px=ctx.getImageData(0,0,WIDTH,h).data;
  const rows=[];
  for(let y=0;y<h;y++){
    const row=new Uint8Array(ROW_BYTES);
    for(let x=0;x<WIDTH;x++){
      const i=(y*WIDTH+x)*4;
      const lum=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
      if(lum < threshold) row[x>>3] |= (1<<(x&7));
    }
    rows.push(row);
  }
  let total=0;
  for(const r of rows) total+=r.length;
  const padded=Math.max(MIN_BYTES,total);
  const out=new Uint8Array(padded);
  let pos=0;
  for(const r of rows){ out.set(r,pos); pos+=r.length; }
  return {buffer:out, lines:padded/ROW_BYTES, preview:c};
}

async function printImage() {
  if(!control || !dataChar) throw new Error("Connect to MXW01 first.");
  if(!selectedImage) throw new Error("Choose a picture first.");

  const threshold = Number($("dark").value);
  log("Preparing picture…");
  const prepared=imageToBuffer(selectedImage, threshold);

  // Optional darkness/intensity.
  await control.writeValueWithoutResponse(command(0xA2,new Uint8Array([threshold])));

  // Ask printer status.
  await control.writeValueWithoutResponse(command(0xA1,new Uint8Array([0])));
  const status=await waitFor(0xA1,7000);
  if(status.length>=13 && status[12]!==0) {
    const err=status.length>=14 ? status[13] : 0;
    throw new Error("Printer reported an error (code 0x"+err.toString(16)+"). Check paper/battery/temperature.");
  }

  // Request monochrome print.
  const lines=prepared.lines;
  const payload=new Uint8Array([lines&255,(lines>>8)&255,0x30,0x00]);
  await control.writeValueWithoutResponse(command(0xA9,payload));
  const ack=await waitFor(0xA9,7000);
  if(!ack.length || ack[0]!==0) throw new Error("Printer rejected the print request.");

  log("Sending " + lines + " lines…");
  // The reverse-engineered implementation sends exactly one 48-byte row per BLE write.
  for(let i=0;i<prepared.buffer.length;i+=ROW_BYTES){
    await dataChar.writeValueWithoutResponse(prepared.buffer.slice(i,i+ROW_BYTES));
    await new Promise(r=>setTimeout(r,15));
    if((i/ROW_BYTES)%25===0) log("Sending… " + Math.round((i/prepared.buffer.length)*100) + "%");
  }

  await control.writeValueWithoutResponse(command(0xAD,new Uint8Array([0])));
  log("Printer is printing…");
  try { await waitFor(0xAA,15000 + lines*70); } catch(e) {}
  log("Print job sent! 🖨️");
}

$("connect").onclick=async()=>{try{await connect()}catch(e){log("Connection error: "+e.message)}};
$("disconnect").onclick=disconnect;
$("print").onclick=async()=>{try{await printImage()}catch(e){log("Print error: "+e.message)}};
$("dark").oninput=()=>{$("darkVal").textContent=$("dark").value};

$("file").onchange=ev=>{
  const f=ev.target.files[0];
  if(!f)return;
  const img=new Image();
  img.onload=()=>{
    selectedImage=img;
    const p=imageToBuffer(img,Number($("dark").value)).preview;
    const pc=$("preview"), ctx=pc.getContext("2d");
    pc.width=p.width; pc.height=p.height; ctx.drawImage(p,0,0);
    $("print").disabled=!control;
    log(control ? "Picture ready to print." : "Picture loaded. Connect the MXW01.");
  };
  img.src=URL.createObjectURL(f);
};
</script>
</body>
</html>
