<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MXW01 Printer V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff}.wrap{max-width:650px;margin:auto;padding:18px}h1{margin:0 0 4px}.sub{color:#aaa;margin-bottom:12px}.tabs{display:flex;gap:8px}.tab{flex:1;padding:13px;border:0;border-radius:12px;background:#292929;color:#ddd;font-weight:700}.tab.active{background:#2f7df6;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#1b1b1b;border-radius:16px;padding:16px;margin:12px 0}button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:#2f7df6;color:#fff;font-weight:700}button.secondary{background:#292929}button:disabled{opacity:.45}label{display:block;margin:10px 0 5px;color:#ccc}input[type=file]{width:100%}input[type=range]{width:100%}select{width:100%;padding:10px;border-radius:10px;background:#292929;color:white;border:1px solid #444}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#fff;border-radius:10px;padding:8px;margin:10px 0;overflow:auto}canvas{display:block;max-width:100%;height:auto;margin:auto}.small{color:#888;font-size:13px;line-height:1.4}#status{white-space:pre-wrap;color:#b9ffb9;min-height:24px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}
</style></head><body><div class="wrap">
<h1>🐱 MXW01 Printer V2</h1><div class="sub">Direct Bluetooth printer + image converter</div>
<div class="tabs"><button class="tab active" data-tab="printer">🖨️ Printer</button><button class="tab" data-tab="converter">🖼️ Image Converter</button></div>

<section id="printer" class="panel active"><div class="card"><button id="connect">Connect MXW01</button><button id="disconnect" class="secondary" disabled>Disconnect</button><div id="status">Not connected.</div></div>
<div class="card"><label>Choose a picture</label><input id="file" type="file" accept="image/*"><div class="box"><canvas id="preview"></canvas></div>
<label>Print threshold: <span id="darkVal">93</span></label><input id="dark" type="range" min="30" max="255" value="93"><button id="print" disabled>🖨️ Print picture</button></div>
<div class="card small">Images are converted to 384-pixel-wide 1-bit thermal data for the MXW01.</div></section>

<section id="converter" class="panel"><div class="card"><label>Choose an image</label><input id="convFile" type="file" accept="image/*">
<div class="grid"><div><label>Mode</label><select id="mode"><option value="bw">Pure Black & White</option><option value="gray">Grayscale</option><option value="dither">Black & White + Dithering</option><option value="invert">Inverted Black & White</option><option value="threshold">Custom Threshold</option></select></div>
<div><label>Width</label><select id="convWidth"><option value="384">384 px (MXW01)</option><option value="288">288 px</option><option value="192">192 px</option><option value="auto">Keep source width</option></select></div></div>
<label>Threshold: <span id="convThreshVal">128</span></label><input id="convThresh" type="range" min="1" max="254" value="128">
<label class="check"><input id="ditherColor" type="checkbox"> Use Floyd-Steinberg dithering</label>
<div class="box"><canvas id="convPreview"></canvas></div><button id="apply">✨ Convert image</button><button id="download" class="secondary" disabled>⬇️ Save converted PNG</button><button id="sendToPrinter" disabled>🖨️ Send converted image to printer</button></div>
<div class="card small">For photos, dithering usually preserves more detail. For simple line art, pure black/white can look cleaner.</div></section>
</div>

<script>
const SERVICE="0000ae30-0000-1000-8000-00805f9b34fb",CONTROL="0000ae01-0000-1000-8000-00805f9b34fb",NOTIFY="0000ae02-0000-1000-8000-00805f9b34fb",DATA="0000ae03-0000-1000-8000-00805f9b34fb",WIDTH=384,ROW=48,MIN=4320;
let device,server,control,notify,dataChar,img,convImg,convCanvas,waiters=[];
const $=x=>document.getElementById(x),T=new Uint8Array(256);
for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&128?((c<<1)^7)&255:(c<<1)&255;T[i]=c}
function crc(a){let c=0;for(const b of a)c=T[c^b];return c}
function cmd(id,p){const o=new Uint8Array(8+p.length);o.set([34,33,id,0,p.length&255,p.length>>8]);o.set(p,6);o[6+p.length]=crc(p);o[7+p.length]=255;return o}
function pkt(a){if(a.length<6||a[0]!=34||a[1]!=33)return null;let n=a[4]|a[5]<<8;return a.length<6+n?null:{id:a[2],p:a.slice(6,6+n)}}
function wait(id,ms=7000){return new Promise((res,rej)=>{let w={id,res};waiters.push(w);setTimeout(()=>{let i=waiters.indexOf(w);if(i>=0){waiters.splice(i,1);rej(Error("Printer timed out."))}},ms)})}
function notifyFn(e){let p=pkt(new Uint8Array(e.target.value.buffer));if(!p)return;for(let i=waiters.length-1;i>=0;i--)if(waiters[i].id==p.id){let w=waiters.splice(i,1)[0];w.res(p.p)}}
function stat(s){$("status").textContent=s}
async function connect(){if(!navigator.bluetooth)throw Error("This browser does not support Web Bluetooth.");stat("Choose MXW01…");device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"MXW01"}],optionalServices:[SERVICE]});server=await device.gatt.connect();let s=await server.getPrimaryService(SERVICE);control=await s.getCharacteristic(CONTROL);notify=await s.getCharacteristic(NOTIFY);dataChar=await s.getCharacteristic(DATA);notify.addEventListener("characteristicvaluechanged",notifyFn);await notify.startNotifications();$("connect").disabled=true;$("disconnect").disabled=false;$("print").disabled=!img;$("sendToPrinter").disabled=!convCanvas;stat("Connected to "+(device.name||"MXW01")+"!")}
async function disconnect(){try{await notify?.stopNotifications()}catch(e){}try{device?.gatt?.disconnect()}catch(e){}device=server=control=notify=dataChar=null;$("connect").disabled=false;$("disconnect").disabled=true;$("print").disabled=true;$("sendToPrinter").disabled=true;stat("Disconnected.")}
function load(f){return new Promise((r,j)=>{let x=new Image();x.onload=()=>r(x);x.onerror=j;x.src=URL.createObjectURL(f)})}
function fit(x,w){w=w=="auto"?x.naturalWidth:+w;let h=Math.max(1,Math.round(x.naturalHeight*w/x.naturalWidth)),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(x,0,0,w,h);return c}
function process(src,mode,t,d){let c=document.createElement("canvas");c.width=src.width;c.height=src.height;let q=c.getContext("2d"),im=q.getImageData(0,0,c.width,c.height),p=im.data;if(mode=="gray"){for(let i=0;i<p.length;i+=4){let y=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=p[i+1]=p[i+2]=y}q.putImageData(im,0,0);return c}let v=new Float32Array(c.width*c.height);for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){let i=(y*c.width+x)*4;v[y*c.width+x]=.299*p[i]+.587*p[i+1]+.114*p[i+2]}for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){let k=y*c.width+x,old=v[k],b=old<t?0:255,er=old-b,o=mode=="invert"?255-b:b;v[k]=b;if(d||mode=="dither"){if(x+1<c.width)v[k+1]+=er*7/16;if(y+1<c.height){if(x)v[k+c.width-1]+=er*3/16;v[k+c.width]+=er*5/16;if(x+1<c.width)v[k+c.width+1]+=er/16}}let i=k*4;p[i]=p[i+1]=p[i+2]=o;p[i+3]=255}q.putImageData(im,0,0);return c}
function show(c,id){let z=$(id);z.width=c.width;z.height=c.height;z.getContext("2d").drawImage(c,0,0)}
function printerData(x,t){let s=fit(x,384),p=s.getContext("2d").getImageData(0,0,384,s.height).data,rows=[];for(let y=0;y<s.height;y++){let r=new Uint8Array(48);for(let x=0;x<384;x++){let i=(y*384+x)*4,l=.299*p[i]+.587*p[i+1]+.114*p[i+2];if(l<t)r[x>>3]|=1<<(x&7)}rows.push(r)}let n=Math.max(MIN,rows.length*48),o=new Uint8Array(n),z=0;for(let r of rows){o.set(r,z);z+=48}return{o,n:n/48}}
async function printIt(x,t){if(!control)throw Error("Connect the MXW01 first.");let q=printerData(x,t);stat("Checking printer…");await control.writeValueWithoutResponse(cmd(161,new Uint8Array([0])));let st=await wait(161);if(st.length>=14&&st[13])throw Error("Printer error 0x"+st[13].toString(16));await control.writeValueWithoutResponse(cmd(169,new Uint8Array([q.n&255,q.n>>8,48,0])));let a=await wait(169);if(!a.length||a[0])throw Error("Printer rejected the job.");for(let i=0;i<q.o.length;i+=48){await dataChar.writeValueWithoutResponse(q.o.slice(i,i+48));await new Promise(r=>setTimeout(r,15));if(i%(48*30)==0)stat("Sending… "+Math.round(i/q.o.length*100)+"%")}await control.writeValueWithoutResponse(cmd(173,new Uint8Array([0])));stat("Printing…");try{await wait(170,15000+q.n*70)}catch(e){}stat("Print job sent! 🖨️")}
$("connect").onclick=async()=>{try{await connect()}catch(e){stat("Connection error: "+e.message)}};$("disconnect").onclick=disconnect;
$("dark").oninput=()=>$("darkVal").textContent=$("dark").value;
$("file").onchange=async e=>{if(e.target.files[0]){img=await load(e.target.files[0]);show(fit(img,384),"preview");$("print").disabled=!control}};
$("print").onclick=async()=>{try{await printIt(img,+$("dark").value)}catch(e){stat("Print error: "+e.message)}};
$("convThresh").oninput=()=>{$("convThreshVal").textContent=$("convThresh").value;if(convImg)convert()};
$("mode").onchange=()=>{if(convImg)convert()};$("convWidth").onchange=()=>{if(convImg)convert()};$("ditherColor").onchange=()=>{if(convImg)convert()};
$("convFile").onchange=async e=>{if(e.target.files[0]){convImg=await load(e.target.files[0]);convert()}};
function convert(){let c=fit(convImg,$("convWidth").value),m=$("mode").value,d=$("ditherColor").checked||m=="dither";convCanvas=process(c,m,+$("convThresh").value,d);show(convCanvas,"convPreview");$("download").disabled=false;$("sendToPrinter").disabled=!control}
$("apply").onclick=()=>{if(convImg)convert()};
$("download").onclick=()=>{convCanvas.toBlob(b=>{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="MXW01_converted.png";a.click()},"image/png")};
$("sendToPrinter").onclick=async()=>{try{let b=await new Promise(r=>convCanvas.toBlob(r,"image/png")),x=await load(b);await printIt(x,128)}catch(e){stat("Print error: "+e.message)}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active")});
</script></body></html>
